<div class="tarjeta-pelicula">
  <div class="tarjeta-header">
    <h2 class="titulo">{{ peli.titulo }}</h2>
    <span class="calificacion"> {{ peli.calificacion }}/10</span>
  </div>
  
  <div class="tarjeta-cuerpo">
    <p class="meta-info"><strong>Estreno:</strong> {{ peli.fecha_estreno }} | <strong>Director:</strong> {{ peli.director }}</p>
    <p class="sinopsis">{{ peli.sinopsis }}</p>
  </div>
  
  <div class="tarjeta-footer">
    <button class="btn-comprar" (click)="comprarTicket()"> Comprar Ticket</button>
  </div>
</div>
